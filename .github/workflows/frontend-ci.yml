name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Next.js Build
        working-directory: frontend
        run: npm run build

      - name: Build Docker Image
        working-directory: frontend
        run: docker build -t gangofthree-frontend:latest .

      - name: Success Message
        run: echo "Frontend built and Docker image verified successfully!"
